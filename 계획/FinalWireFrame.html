<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNU Campus Life ????댁뼱?꾨젅??/title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --blue: #1A56DB;
    --blue-light: #E8F0FE;
    --blue-mid: #3B82F6;
    --dark: #111827;
    --gray: #6B7280;
    --gray-light: #F3F4F6;
    --border: #E5E7EB;
    --white: #ffffff;
    --accent: #F59E0B;
    --green: #10B981;
    --red: #EF4444;
    --purple: #8B5CF6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #0F1629;
    color: var(--dark);
    min-height: 100vh;
  }

  /* ?? HEADER ?? */
  .page-header {
    background: #0F1629;
    padding: 48px 60px 32px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .page-header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--blue-mid);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .page-header h2 {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
  }
  .page-header p {
    color: rgba(255,255,255,0.45);
    font-size: 14px;
    margin-top: 8px;
  }

  /* ?? SECTION ?? */
  .section {
    padding: 60px 60px;
  }
  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--blue-mid);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .section-title {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 32px;
  }

  /* ?? GRID ?? */
  .screens-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 40px;
  }
  .screens-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
  }
  .screens-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
  }

  /* ?? PHONE FRAME ?? */
  .phone-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .phone-label {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    text-align: center;
    letter-spacing: 0.5px;
  }
  .phone-sublabel {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    margin-top: -12px;
  }
  .phone {
    width: 280px;
    height: 560px;
    background: var(--white);
    border-radius: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    overflow: hidden;
    position: relative;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
  }
  .phone.wide {
    width: 560px;
  }

  /* status bar */
  .status-bar {
    background: var(--blue);
    padding: 8px 16px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .status-bar span {
    font-size: 10px;
    color: rgba(255,255,255,0.9);
    font-weight: 600;
  }
  .status-icons { display: flex; gap: 4px; align-items: center; }
  .status-icons .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.8); }

  /* top nav */
  .top-nav {
    background: var(--blue);
    padding: 8px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .top-nav .logo {
    font-size: 11px;
    font-weight: 700;
    color: white;
    line-height: 1.3;
  }
  .top-nav .logo span { display: block; font-size: 9px; font-weight: 400; opacity: 0.7; }
  .nav-icon { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .nav-icon svg { width: 14px; height: 14px; fill: white; }
  .nav-icons-row { display: flex; gap: 6px; }

  /* hamburger icon */
  .hamburger { display: flex; flex-direction: column; gap: 3px; padding: 4px; cursor: pointer; }
  .hamburger span { display: block; width: 16px; height: 2px; background: white; border-radius: 2px; }

  /* scroll body */
  .phone-body {
    flex: 1;
    overflow-y: auto;
    background: #F8FAFF;
    scrollbar-width: none;
  }
  .phone-body::-webkit-scrollbar { display: none; }

  /* bottom tab bar */
  .tab-bar {
    background: white;
    border-top: 1px solid var(--border);
    display: flex;
    padding: 6px 0 8px;
    flex-shrink: 0;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }
  .tab-icon { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .tab-icon.active { background: var(--blue-light); }
  .tab-icon svg { width: 14px; height: 14px; }
  .tab-icon svg.active-svg { fill: var(--blue); }
  .tab-icon svg.inactive-svg { fill: var(--gray); }
  .tab-text { font-size: 9px; color: var(--gray); font-weight: 500; }
  .tab-text.active { color: var(--blue); font-weight: 700; }

  /* ?? COMPONENTS ?? */
  .search-bar {
    margin: 10px 12px;
    background: white;
    border-radius: 12px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .search-bar .search-icon { width: 14px; height: 14px; fill: var(--gray); flex-shrink: 0; }
  .search-bar span { font-size: 11px; color: #9CA3AF; }
  .search-bar .mic { margin-left: auto; width: 14px; height: 14px; fill: var(--blue); flex-shrink: 0; }

  .chip-row { display: flex; gap: 6px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
  .chip { background: white; border: 1.5px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 10px; color: var(--dark); white-space: nowrap; font-weight: 500; }
  .chip.blue { background: var(--blue); border-color: var(--blue); color: white; }

  .card {
    background: white;
    border-radius: 14px;
    margin: 8px 12px;
    padding: 12px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-title { font-size: 12px; font-weight: 700; color: var(--dark); display: flex; align-items: center; gap: 5px; }
  .card-title .icon { width: 16px; height: 16px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .card-title .icon.blue { background: var(--blue); }
  .card-title .icon.amber { background: var(--accent); }
  .card-title .icon svg { width: 9px; height: 9px; fill: white; }
  .card-more { font-size: 10px; color: var(--blue); font-weight: 600; }

  .class-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--gray-light); }
  .class-item:last-child { border-bottom: none; }
  .class-time { font-size: 10px; color: var(--blue); font-weight: 700; width: 36px; flex-shrink: 0; }
  .class-info { flex: 1; }
  .class-name { font-size: 11px; font-weight: 600; color: var(--dark); }
  .class-room { font-size: 10px; color: var(--gray); }
  .class-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .notice-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--gray-light); }
  .notice-item:last-child { border-bottom: none; }
  .notice-badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; margin-top: 1px; }
  .badge-school { background: #DBEAFE; color: #1E40AF; }
  .badge-scholarship { background: #D1FAE5; color: #065F46; }
  .badge-career { background: #FEF3C7; color: #92400E; }
  .notice-text { font-size: 10px; color: var(--dark); line-height: 1.4; }
  .notice-date { font-size: 9px; color: var(--gray); margin-top: 2px; }

  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 12px; }
  .quick-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .quick-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .quick-icon.blue { background: var(--blue); }
  .quick-icon.amber { background: var(--accent); }
  .quick-icon.green { background: var(--green); }
  .quick-icon.purple { background: var(--purple); }
  .quick-icon svg { width: 20px; height: 20px; fill: white; }
  .quick-label { font-size: 10px; color: var(--dark); font-weight: 500; text-align: center; }

  /* Drawer */
  .drawer-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 10;
    display: flex;
  }
  .drawer {
    width: 220px;
    height: 100%;
    background: white;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .drawer-profile {
    background: linear-gradient(135deg, var(--blue) 0%, #3B82F6 100%);
    padding: 20px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .drawer-avatar { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.4); flex-shrink: 0; }
  .drawer-avatar svg { width: 24px; height: 24px; fill: white; }
  .drawer-user-name { font-size: 13px; font-weight: 700; color: white; }
  .drawer-user-info { font-size: 10px; color: rgba(255,255,255,0.75); margin-top: 2px; }
  .drawer-menu-section { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .drawer-menu-label { font-size: 9px; font-weight: 700; color: var(--gray); letter-spacing: 1px; text-transform: uppercase; padding: 6px 16px 4px; }
  .drawer-menu-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; }
  .drawer-menu-item:hover { background: var(--blue-light); }
  .drawer-menu-item .d-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .drawer-menu-item svg { width: 14px; height: 14px; }
  .drawer-menu-item span { font-size: 12px; font-weight: 500; color: var(--dark); }
  .drawer-settings { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .settings-btn { flex: 1; background: var(--gray-light); border-radius: 8px; padding: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--gray); cursor: pointer; }
  .settings-btn svg { width: 12px; height: 12px; fill: var(--gray); }

  /* ?? TIMETABLE ?? */
  .timetable-header { background: var(--blue); padding: 8px 12px; }
  .tt-tabs { display: flex; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 2px; gap: 2px; }
  .tt-tab { flex: 1; text-align: center; padding: 5px; border-radius: 6px; font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.6); cursor: pointer; }
  .tt-tab.active { background: white; color: var(--blue); }

  .timetable-grid { overflow-x: auto; padding: 8px; }
  .tt-table { width: 100%; border-collapse: collapse; font-size: 9px; }
  .tt-table th { background: var(--blue); color: white; padding: 4px 2px; text-align: center; font-size: 9px; font-weight: 600; }
  .tt-table .time-col { color: var(--gray); padding: 2px 3px; font-size: 8px; vertical-align: top; background: white; }
  .tt-cell { border: 1px solid var(--border); padding: 2px; vertical-align: top; height: 28px; }
  .tt-block { border-radius: 4px; padding: 2px 3px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .tt-block .b-name { font-size: 8px; font-weight: 700; line-height: 1.2; }
  .tt-block .b-room { font-size: 7px; opacity: 0.8; }
  .tt-block.blue-block { background: #DBEAFE; }
  .tt-block.green-block { background: #D1FAE5; }
  .tt-block.purple-block { background: #EDE9FE; }
  .tt-block.amber-block { background: #FEF3C7; }
  .tt-block.red-block { background: #FEE2E2; }
  .tt-add-btn { margin: 6px 12px; background: var(--blue); color: white; border-radius: 10px; padding: 10px; text-align: center; font-size: 11px; font-weight: 700; cursor: pointer; }

  /* ?? CHATBOT ?? */
  .chat-area { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .chat-suggestions { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px; }
  .suggest-chip { background: var(--blue-light); border: 1.5px solid var(--blue); border-radius: 16px; padding: 5px 10px; font-size: 10px; color: var(--blue); font-weight: 600; cursor: pointer; }
  .msg-row { display: flex; align-items: flex-end; gap: 6px; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--blue-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .msg-avatar svg { width: 14px; height: 14px; fill: var(--blue); }
  .msg-bubble { max-width: 75%; padding: 8px 10px; border-radius: 14px; font-size: 10px; line-height: 1.5; }
  .msg-bubble.ai { background: white; color: var(--dark); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-bubble.user { background: var(--blue); color: white; border-bottom-right-radius: 4px; }
  .chat-input-area { background: white; border-top: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .chat-input { flex: 1; background: var(--gray-light); border-radius: 20px; padding: 7px 12px; font-size: 10px; color: var(--gray); }
  .send-btn { width: 30px; height: 30px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
  .send-btn svg { width: 14px; height: 14px; fill: white; }

  /* ?? CAMPUS MAP ?? */
  .map-area { background: #E8F4E8; flex: 1; position: relative; overflow: hidden; }
  .map-bg { width: 100%; height: 100%; object-fit: cover; }
  .map-marker { position: absolute; display: flex; flex-direction: column; align-items: center; }
  .marker-pin { width: 24px; height: 24px; background: var(--blue); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .marker-label { font-size: 8px; font-weight: 700; color: var(--dark); background: white; border-radius: 4px; padding: 2px 4px; margin-top: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); white-space: nowrap; }
  .map-popup { position: absolute; bottom: 0; left: 0; right: 0; background: white; border-radius: 16px 16px 0 0; padding: 12px 14px; box-shadow: 0 -4px 20px rgba(0,0,0,0.12); }
  .popup-drag { width: 32px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 10px; }
  .popup-name { font-size: 13px; font-weight: 800; color: var(--dark); }
  .popup-sub { font-size: 10px; color: var(--gray); margin-top: 2px; }
  .popup-tags { display: flex; gap: 4px; margin-top: 8px; }
  .popup-tag { background: var(--blue-light); color: var(--blue); font-size: 9px; font-weight: 600; padding: 3px 7px; border-radius: 6px; }
  .popup-btn { background: var(--blue); color: white; border-radius: 8px; padding: 8px; text-align: center; font-size: 10px; font-weight: 700; margin-top: 10px; cursor: pointer; }

  /* ?? NOTICE ?? */
  .notice-list { padding: 8px 12px; }
  .notice-card { background: white; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .nc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .nc-title { font-size: 11px; font-weight: 600; color: var(--dark); flex: 1; margin-right: 6px; line-height: 1.4; }
  .nc-new { width: 6px; height: 6px; background: var(--red); border-radius: 50%; flex-shrink: 0; }
  .nc-bottom { display: flex; align-items: center; gap: 6px; }
  .nc-date { font-size: 9px; color: var(--gray); }
  .cat-tabs { display: flex; gap: 4px; padding: 8px 12px 4px; overflow-x: auto; scrollbar-width: none; }
  .cat-tab { padding: 5px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; background: white; border: 1.5px solid var(--border); color: var(--gray); white-space: nowrap; cursor: pointer; }
  .cat-tab.active { background: var(--blue); border-color: var(--blue); color: white; }

  /* ?? CAFETERIA ?? */
  .menu-date { padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
  .date-nav { width: 22px; height: 22px; border-radius: 6px; background: white; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .date-nav svg { width: 10px; height: 10px; fill: var(--gray); }
  .date-text { font-size: 12px; font-weight: 700; color: var(--dark); flex: 1; text-align: center; }
  .menu-image-card {
    background: white;
    border-radius: 14px;
    margin: 8px 12px;
    padding: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .menu-header {
    margin-bottom: 10px;
  }
  .menu-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--dark);
  }
  .menu-date-range {
    font-size: 10px;
    color: var(--gray);
    margin-top: 2px;
  }
  .menu-image-wrap {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  }
  .menu-image {
    width: 100%;
    display: block;
  }

  /* ?? SHUTTLE ?? */
  .shuttle-card { background: var(--blue); border-radius: 12px; margin: 8px 12px; padding: 12px 14px; }
  .shuttle-next-label { font-size: 10px; color: rgba(255,255,255,0.7); }
  .shuttle-time { font-size: 28px; font-weight: 900; color: white; font-family: 'Space Mono', monospace; }
  .shuttle-route { font-size: 10px; color: rgba(255,255,255,0.8); margin-top: 2px; }
  .shuttle-list { padding: 0 12px; }
  .shuttle-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .shuttle-time-text { font-size: 12px; font-weight: 700; color: var(--dark); width: 44px; font-family: 'Space Mono', monospace; }
  .shuttle-stop { font-size: 10px; color: var(--gray); }
  .shuttle-badge { margin-left: auto; font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
  .shuttle-badge.soon { background: #FEF3C7; color: #92400E; }
  .shuttle-badge.go { background: #D1FAE5; color: #065F46; }

  /* ?? SETTINGS ?? */
  .profile-section { background: linear-gradient(135deg, var(--blue) 0%, #3B82F6 100%); padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .profile-avatar-lg { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.25); border: 3px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; }
  .profile-avatar-lg svg { width: 36px; height: 36px; fill: white; }
  .profile-name { font-size: 16px; font-weight: 800; color: white; }
  .profile-detail { font-size: 11px; color: rgba(255,255,255,0.75); }
  .settings-section { padding: 8px 0; }
  .settings-label { font-size: 10px; font-weight: 700; color: var(--gray); letter-spacing: 1px; padding: 6px 14px 4px; }
  .settings-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: white; border-bottom: 1px solid var(--gray-light); }
  .settings-row svg { width: 16px; height: 16px; fill: var(--gray); flex-shrink: 0; }
  .settings-row span { font-size: 12px; color: var(--dark); flex: 1; }
  .toggle { width: 36px; height: 20px; background: var(--blue); border-radius: 10px; position: relative; cursor: pointer; flex-shrink: 0; }
  .toggle::after { content: ''; position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; background: white; border-radius: 50%; }
  .toggle.off { background: var(--border); }
  .toggle.off::after { right: auto; left: 3px; }
  .chevron { width: 14px; height: 14px; fill: var(--gray); flex-shrink: 0; }

  /* ?? TIMETABLE WIZARD ?? */
  .wizard-step { padding: 10px 12px; }
  .wizard-title { font-size: 13px; font-weight: 800; color: var(--dark); margin-bottom: 12px; }
  .wizard-label { font-size: 10px; font-weight: 600; color: var(--gray); margin-bottom: 5px; }
  .option-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
