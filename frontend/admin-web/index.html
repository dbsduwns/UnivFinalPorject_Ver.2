<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>KNU Campus 관리자 센터</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="login-view" class="login-shell">
      <form id="login-form" class="login-card">
        <div class="brand">K</div><p class="eyebrow">KNU CAMPUS</p>
        <h1>관리자 센터</h1><p class="muted">관리자 계정으로 로그인해 주세요.</p>
        <label>이메일<input id="email" type="email" autocomplete="username" required /></label>
        <label>비밀번호<input id="password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="error" role="alert"></p>
        <button>로그인</button>
      </form>
    </main>
    <main id="app-view" hidden>
      <aside><div class="side-brand"><span>K</span><b>KNU Campus</b></div><nav id="nav"></nav><button id="logout" class="ghost">로그아웃</button></aside>
      <section class="workspace"><header><div><p id="crumb" class="eyebrow">ADMIN CENTER</p><h1 id="page-title">대시보드</h1></div><div id="admin-name" class="account"></div></header><div id="flash" role="status" aria-live="polite"></div><div id="content"></div></section>
    </main>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <script src="/config.js"></script><script src="/app.js" defer></script>
  </body>
</html>
