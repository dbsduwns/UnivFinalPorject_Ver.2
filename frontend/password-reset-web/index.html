<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>KNU Campus | 비밀번호 재설정</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="reset-card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">K</div>
        <p class="eyebrow">KNU CAMPUS LIFE</p>
        <h1 id="page-title">새 비밀번호 설정</h1>
        <p class="intro">새로 사용할 비밀번호를 입력해 주세요.</p>

        <div id="invalid-token" class="notice notice-error" role="alert" hidden>
          재설정 링크가 없거나 올바르지 않습니다. 이메일에서 최신 링크를 다시 열어 주세요.
        </div>
        <div id="message" class="notice" role="status" aria-live="polite" hidden></div>

        <form id="reset-form" novalidate>
          <label for="new-password">새 비밀번호</label>
          <input
            id="new-password"
            name="new-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
            placeholder="8자 이상 입력해 주세요"
          />

          <label for="confirm-password">새 비밀번호 확인</label>
          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
            placeholder="비밀번호를 다시 입력해 주세요"
          />

          <p class="hint">두 비밀번호는 같아야 하며, 비밀번호는 72바이트 이하여야 합니다.</p>
          <button id="submit-button" type="submit">비밀번호 변경</button>
        </form>

        <a class="back-link" href="https://knu-campus-api-744461686522.asia-northeast3.run.app/docs">KNU Campus로 돌아가기</a>
      </section>
      <p class="footer">안전한 계정 관리를 위해 재설정 링크는 한 번만 사용할 수 있습니다.</p>
    </main>
    <script src="/config.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
